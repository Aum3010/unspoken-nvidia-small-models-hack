      pain: ["J'ai mal"]
      nurse: ["Appelez l'infirmière", "Appelez l'infirmier"]
      breathe: ["Je n'arrive pas à respirer", "Je ne peux pas respirer"]
      suction: ["J'ai besoin d'une aspiration"]
      reposition: ["Changez-moi de position s'il vous plaît"]
      cold: ["J'ai froid"]
      hot: ["J'ai trop chaud"]
      bathroom: ["J'ai besoin d'aller aux toilettes"]
      light: ["Éteignez la lumière"]
      family: ["Où est ma famille ?"]
      time: ["Quelle heure est-il ?"]
      sick: ["Je me sens mal", "J'ai la nausée"]
      scared: ["J'ai peur"]
      tired: ["Je suis fatigué", "Je suis fatiguée"]
      pillow: ["Arrangez mon oreiller"]
      "yes": ["Oui"]
      "no": ["Non"]
      help: ["Aidez-moi"]
      stop: ["Arrêtez", "Stop"]
  de:
    name: Deutsch
    locale: de-DE
    review_status: draft (needs native-speaker review)
    negation_words: ["nicht", "kein", "keine", "nein", "nie"]
    phrases:
      water: ["Ich brauche Wasser"]
      pain: ["Ich habe Schmerzen"]
      nurse: ["Rufen Sie die Pflegekraft", "Rufen Sie die Krankenschwester"]
      breathe: ["Ich kann nicht atmen", "Ich bekomme keine Luft"]
      suction: ["Ich muss abgesaugt werden"]
      reposition: ["Bitte lagern Sie mich um"]
      cold: ["Mir ist kalt"]
      hot: ["Mir ist zu heiß"]
      bathroom: ["Ich muss auf die Toilette"]
      light: ["Machen Sie das Licht aus"]
      family: ["Wo ist meine Familie?"]
      time: ["Wie spät ist es?"]
      sick: ["Mir ist übel", "Mir ist schlecht"]
      scared: ["Ich habe Angst"]
      tired: ["Ich bin müde"]
      pillow: ["Richten Sie mein Kissen"]
      "yes": ["Ja"]
      "no": ["Nein"]
      help: ["Helfen Sie mir"]
      stop: ["Stopp", "Aufhören"]
  zh:
    name: 中文
    locale: zh-CN
    review_status: draft (needs native-speaker review)
    negation_words: ["不", "没", "别"]          # matched as substrings (no spaces in Chinese)
    phrases:
      water: ["我需要水", "我要喝水"]
      pain: ["我很疼", "我疼"]
      nurse: ["叫护士"]
      breathe: ["我喘不过气", "我不能呼吸"]
      suction: ["我需要吸痰"]
      reposition: ["请帮我翻身"]
      cold: ["我冷", "我很冷"]
      hot: ["我太热了"]
      bathroom: ["我要上厕所"]
      light: ["把灯关掉", "关灯"]
      family: ["我的家人在哪里"]
      time: ["现在几点了"]
      sick: ["我不舒服", "我想吐"]
      scared: ["我害怕"]
